# 編集カレンダーとネタ帳。
# 曜日 (JST) ごとにテーマ・形式・記事末 CTA が決まり、topics の上から未使用のものを 1 本ずつ使う。
# ネタを足すときは topics に 1 行追加するだけ。使用済みは editorial/used-topics.json に記録される。
# topics が尽きたテーマは、生成時にモデルが新しい切り口を考える。

weekdays:
  mon: habit
  tue: menu
  wed: machine
  thu: food
  fri: gym
  sat: home
  sun: selftaught

themes:
  habit:
    label: 習慣化
    category: 習慣化
    format: article
    cta: habit
    brief: >-
      ジム通いを続けるための考え方と具体的な工夫。頻度の決め方、サボった後の立て直し、
      忙しい人の時間の作り方など。根性論ではなく仕組みで続ける話にする。
    topics:
      - ジム 週2回 効果
      - ジム 続かない 理由 と対策
      - ジム 仕事終わり 行く気が出ない
      - ジム 朝と夜 どっちが続く
      - ジム 1回 何分 短時間でもいい
      - ジム 久しぶり 再開 メニュー
      - ジム 三日坊主 抜け出す 目標の立て方
      - ジム 行く頻度 初心者 週何回
      - 筋トレ 記録 つけ方 続くコツ
      - ジム 混雑 避ける 時間帯 の選び方
      - ジム 幽霊会員 にならない 最初の1か月

  menu:
    label: 筋トレメニュー
    category: 筋トレメニュー
    format: visual
    cta: menu
    use_exercises: true
    brief: >-
      目的・頻度・レベル別のメニューの組み方。アプリに登録されている種目の中から組み、
      種目名・回数とセット数の目安・順番を表や番号付きリストで整理する。
    topics:
      - ジム 初心者 メニュー 週2回 全身
      - 筋トレ 分割法 週3回 組み方
      - ジム マシンだけ メニュー 1時間
      - 胸 筋トレ メニュー マシン 初心者
      - 背中 筋トレ メニュー ジム 初心者
      - 脚トレ メニュー ジム きつくない 始め方
      - 肩 筋トレ メニュー ダンベル マシン
      - 腕 筋トレ メニュー 二頭 三頭 ジム
      - 腹筋 メニュー ジム マシン 自重
      - 筋トレ 30分 時短メニュー ジム
      - 有酸素 筋トレ 順番 どっちが先

  machine:
    label: マシンの使い方
    category: マシンの使い方
    format: visual
    cta: beginner
    use_exercises: true
    brief: >-
      1 記事につき 1 つのマシン・種目の使い方。セッティング、動作の手順、フォームのポイント、
      よくある間違いと直し方を図解的に整理する。
    topics:
      - ラットプルダウン 効かない 原因 と直し方
      - チェストプレス 使い方 シートの高さ
      - レッグプレス 足の位置 効く部位
      - シーテッドロウ フォーム 背中に効かせる
      - ショルダープレス マシン 使い方 肩がすくむ
      - レッグカール レッグエクステンション 違い 使い方
      - ペックフライ 使い方 肩が痛くならない 位置
      - アブドミナルマシン 使い方 腹筋に効かない
      - スミスマシン スクワット 足の位置 フォーム
      - アシストチンニング 使い方 懸垂 できない人
      - トレッドミル 使い方 初心者 速度 傾斜
      - ヒップアブダクション アダクション 違い 使い方

  food:
    label: 食事
    category: 食事知識
    format: dialogue
    cta: ai
    brief: >-
      筋トレをする人の食事の基本。タンパク質・糖質・脂質の考え方、タイミング、コンビニや外食での選び方。
      極端な制限は勧めず、続けられる範囲の工夫を話す。
    topics:
      - 筋トレ 食事 タイミング 前後 何を食べる
      - タンパク質 1日 どのくらい 目安
      - 筋トレ コンビニ 食事 選び方
      - プロテイン 飲むタイミング 初心者
      - ジム 前 食事 何時間前
      - 筋トレ 朝食 食べない 影響
      - 減量 食事 炭水化物 抜かない 考え方
      - 筋トレ 外食 メニュー 選び方
      - 筋トレ 後 夜遅い 食事 どうする
      - 筋トレ 水分補給 量 タイミング
      - 筋トレ 自炊 作り置き 続けやすい 考え方

  gym:
    label: ジム選び
    category: ジム選び
    format: article
    cta: gym
    require_components: [GymCta]
    brief: >-
      ジムの選び方と、話題のジムチェーンのタイプ別の向き不向き。料金・店舗数・設備・キャンペーンの
      具体的な数字は書かず、選ぶときの観点とチェック方法を伝える。本文に GymCta を 1 つ入れる。
    topics:
      - 24時間ジム 選び方 初心者 チェックポイント
      - コンビニジム 総合ジム 違い 向いている人
      - chocoZAP 向いている人 向いていない人
      - エニタイムフィットネス 初心者 利用の流れ
      - ジム 見学 体験 チェックすること
      - ジム 家の近く 職場の近く どっちがいい
      - 公営ジム 民間ジム 違い 選び方
      - ジム 混雑 入会前に確認する方法
      - ジム 女性 選び方 通いやすさ
      - ジム 掛け持ち 2つ通う 使い分け
      - ジム 乗り換え 退会前 確認すること

  home:
    label: 宅トレ
    category: 宅トレ
    format: article
    cta: default
    brief: >-
      自宅でできるトレーニング。ジムに行けない日の代替メニュー、器具なし・ダンベルだけのメニュー、
      騒音やスペースへの配慮。ジムと組み合わせて習慣を切らさない視点を入れる。
    topics:
      - 宅トレ 器具なし メニュー 初心者 10分
      - ジム 行けない日 自宅 代わりのメニュー
      - プッシュアップ できない 段階的 やり方
      - プランク 正しいフォーム 何秒 目安
      - 自宅 ダンベル だけ 全身メニュー
      - 宅トレ マンション 騒音 静かにできる 種目
      - 自重 スクワット フォーム 膝 つま先
      - 宅トレ 続かない ジムと併用 コツ
      - 寝る前 ストレッチ 筋トレ 後 ケア
      - 宅トレ 背中 器具なし 鍛え方
      - 雨の日 自宅 有酸素 その場でできる

  selftaught:
    label: 独学トレーニング
    category: 独学トレーニング
    format: dialogue
    cta: ai
    brief: >-
      パーソナルトレーナーに通わずに自分で学んで上達する方法。フォームの確認の仕方、重量の決め方、
      伸び悩んだときの見直し方、情報の選び方。一人でも学べるという前向きな話にする。
    topics:
      - 筋トレ 独学 何から始める
      - パーソナルトレーナー なし フォーム 確認方法
      - 筋トレ 重量 決め方 初心者 目安
      - 筋トレ 回数 セット数 決め方 基本
      - 筋トレ 伸びない 停滞 見直すポイント
      - 筋トレ 動画 フォーム 自撮り チェック方法
      - 筋肉痛 ない 効いてない 本当か
      - 筋トレ 休む日 頻度 回復 考え方
      - ジム 一人 恥ずかしい 初日 動き方
      - 筋トレ 情報 多すぎる 何を信じる
      - AIトレーナー 相談 メニュー 使い方

# アプリに登録されている種目 (筋トレメニュー・マシン記事の題材)。
# 出典: anytime-journey-server の training-menu シード。種目が増えたらここも更新する。
exercises:
  Chest: [チェストプレス, ダンベルベンチプレス, ペックフライ, ケーブルクロスオーバー, プッシュアップ]
  Shoulder: [ショルダープレス, サイドレイズ, フロントレイズ, リアデルトフライ]
  Back: [ラットプルダウン, シーテッドロウ, バックエクステンション, アシストチンニング]
  Forearm: [リストカール, リバースリストカール]
  Triceps: [トライセプスプッシュダウン, キックバック, オーバーヘッドエクステンション]
  Biceps: [ダンベルカール, ケーブルカール, ハンマーカール]
  Legs:
    - レッグプレス
    - レッグエクステンション
    - レッグカール
    - カーフレイズ
    - ヒップアブダクション
    - ヒップアダクション
    - スミスマシンスクワット
  Abs: [クランチ, プランク, アブドミナルマシン, レッグレイズ]
  Cardio: [トレッドミル, エアロバイク, クロストレーナー, ローイングマシン, ウォーキング, ランニング, サイクリング]
